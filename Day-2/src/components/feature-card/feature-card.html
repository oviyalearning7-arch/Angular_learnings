<div style="border: 1px solid #e0e0e0; padding: 16px; margin-bottom: 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; background-color: #fafafa; font-family: sans-serif;">
  <div>
    <strong style="font-size: 16px; color: #333;">{{ featureData().name }}</strong>
    <span style="margin-left: 8px; font-size: 12px; font-weight: bold; padding: 2px 6px; border-radius: 4px; background: #eef2f3; color: #555;">
      {{ featureData().tier | uppercase }}
    </span>
  </div>

  <div style="display: flex; align-items: center; gap: 16px;">
    <!-- Reading dynamic active status flags -->
    @if (featureData().active) {
      <span style="color: #2e7d32; font-weight: bold; background: #e8f5e9; padding: 4px 8px; border-radius: 4px; font-size: 14px;">
        ✔ Active
      </span>
    } @else {
      <span style="color: #c62828; font-weight: bold; background: #ffebee; padding: 4px 8px; border-radius: 4px; font-size: 14px;">
        ✖ Disabled
      </span>
    }

    <button 
      (click)="executeToggle()" 
      style="padding: 6px 12px; border: 1px solid #ccc; border-radius: 4px; background: #fff; cursor: pointer; font-weight: 600; transition: background 0.2s;"
      onmouseover="this.style.background='#f0f0f0'" 
      onmouseout="this.style.background='#fff'">
      Toggle Status
    </button>
  </div>
</div>
